name: build-swiftpm

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install

      - name: Build single-file version
        run: pnpm build-single-file
        env:
          LOCAL_CONFIG_FILE: config.mcraft-only.json

      - name: Assemble MinecraftWeb.swiftpm
        run: |
          mkdir -p "$(dirname 'MinecraftWeb.swiftpm/Package.swift')"
          cat > 'MinecraftWeb.swiftpm/Package.swift' <<'SWIFT_EOF'
          // swift-tools-version: 5.9

          import PackageDescription
          import AppleProductTypes

          let package = Package(
              name: "MinecraftWeb",
              platforms: [
                  .iOS("16.0")
              ],
              products: [
                  .iOSApplication(
                      name: "MinecraftWeb",
                      targets: ["AppModule"],
                      bundleIdentifier: "com.example.MinecraftWeb",
                      teamIdentifier: "",
                      displayVersion: "1.0",
                      bundleVersion: "1",
                      appIcon: .placeholder(icon: .cloud),
                      accentColor: .presetColor(.cyan),
                      supportedDeviceFamilies: [
                          .pad,
                          .phone
                      ],
                      supportedInterfaceOrientations: [
                          .landscapeRight,
                          .landscapeLeft,
                          .portrait
                      ],
                      capabilities: [
                          .outgoingNetworkConnections()
                      ]
                  )
              ],
              targets: [
                  .executableTarget(
                      name: "AppModule",
                      path: "Sources",
                      resources: [
                          .copy("Resources/minecraft.html")
                      ]
                  )
              ]
          )
          SWIFT_EOF
          mkdir -p "$(dirname 'MinecraftWeb.swiftpm/Sources/MyApp.swift')"
          cat > 'MinecraftWeb.swiftpm/Sources/MyApp.swift' <<'SWIFT_EOF'
          import SwiftUI

          @main
          struct MyApp: App {
              var body: some Scene {
                  WindowGroup {
                      ContentView()
                          .ignoresSafeArea()
                          .statusBarHidden(true)
                          .persistentSystemOverlays(.hidden)
                  }
              }
          }
          SWIFT_EOF
          mkdir -p "$(dirname 'MinecraftWeb.swiftpm/Sources/ContentView.swift')"
          cat > 'MinecraftWeb.swiftpm/Sources/ContentView.swift' <<'SWIFT_EOF'
          import SwiftUI

          struct ContentView: View {
              var body: some View {
                  if let url = Bundle.main.url(forResource: "minecraft", withExtension: "html") {
                      WebView(fileURL: url)
                          .background(Color.black)
                  } else {
                      VStack(spacing: 12) {
                          Text("minecraft.html が見つかりません")
                              .font(.headline)
                          Text("Sources/Resources フォルダに GitHub Actions で作った minecraft.html を入れてください")
                              .font(.subheadline)
                              .foregroundStyle(.secondary)
                              .multilineTextAlignment(.center)
                      }
                      .padding()
                  }
              }
          }
          SWIFT_EOF
          mkdir -p "$(dirname 'MinecraftWeb.swiftpm/Sources/WebView.swift')"
          cat > 'MinecraftWeb.swiftpm/Sources/WebView.swift' <<'SWIFT_EOF'
          import SwiftUI
          import WebKit

          struct WebView: UIViewRepresentable {
              let fileURL: URL

              func makeUIView(context: Context) -> WKWebView {
                  let config = WKWebViewConfiguration()
                  config.allowsInlineMediaPlayback = true
                  config.mediaTypesRequiringUserActionForPlayback = []
                  config.preferences.javaScriptCanOpenWindowsAutomatically = true
                  config.websiteDataStore = .default()

                  let webView = WKWebView(frame: .zero, configuration: config)
                  webView.isOpaque = false
                  webView.backgroundColor = .black
                  webView.scrollView.backgroundColor = .black
                  webView.scrollView.contentInsetAdjustmentBehavior = .never
                  webView.scrollView.bounces = false
                  webView.scrollView.isScrollEnabled = false
                  webView.uiDelegate = context.coordinator
                  if #available(iOS 16.4, *) {
                      webView.isInspectable = true
                  }

                  webView.loadFileURL(fileURL, allowingReadAccessTo: fileURL.deletingLastPathComponent())
                  return webView
              }

              func updateUIView(_ uiView: WKWebView, context: Context) {}

              func makeCoordinator() -> Coordinator { Coordinator() }

              final class Coordinator: NSObject, WKUIDelegate {
                  // JS の alert / confirm / prompt を表示する
                  func webView(_ webView: WKWebView, runJavaScriptAlertPanelWithMessage message: String,
                               initiatedByFrame frame: WKFrameInfo, completionHandler: @escaping () -> Void) {
                      present(title: nil, message: message, actions: [("OK", { completionHandler() })])
                  }

                  func webView(_ webView: WKWebView, runJavaScriptConfirmPanelWithMessage message: String,
                               initiatedByFrame frame: WKFrameInfo, completionHandler: @escaping (Bool) -> Void) {
                      present(title: nil, message: message, actions: [
                          ("キャンセル", { completionHandler(false) }),
                          ("OK", { completionHandler(true) })
                      ])
                  }

                  private func present(title: String?, message: String, actions: [(String, () -> Void)]) {
                      guard let root = UIApplication.shared.connectedScenes
                          .compactMap({ ($0 as? UIWindowScene)?.keyWindow?.rootViewController }).first else {
                          actions.last?.1()
                          return
                      }
                      let alert = UIAlertController(title: title, message: message, preferredStyle: .alert)
                      for (label, handler) in actions {
                          alert.addAction(UIAlertAction(title: label, style: .default) { _ in handler() })
                      }
                      root.present(alert, animated: true)
                  }
              }
          }
          SWIFT_EOF
          mkdir -p MinecraftWeb.swiftpm/Sources/Resources
          cp dist/single/index.html MinecraftWeb.swiftpm/Sources/Resources/minecraft.html
          ls -lh MinecraftWeb.swiftpm/Sources/Resources/
          zip -r MinecraftWeb-swiftpm.zip MinecraftWeb.swiftpm

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MinecraftWeb-swiftpm
          path: MinecraftWeb-swiftpm.zip
